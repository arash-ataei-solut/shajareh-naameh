{% load i18n %}


<button id="notification-dropdown" hx-swap-oob="innerHTML">
    <i class="fa-solid fa-bell"></i>
</button>


{% for object in object_list %}
    <li class="dropdown-item text-truncate">
        {{ object.title }}
    </li>
{% endfor %}
<li class="dropdown-item">
    <a href="{% url 'users:notifications-list-profile' %}" class="d-block">
        <i class="fa-solid fa-list me-2"></i>{% trans 'لیست اعلان‌ها' %}
    </a>
</li>
