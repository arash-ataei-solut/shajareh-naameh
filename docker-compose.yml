version: '3.3'

volumes:
  postgres_data:
  redis_data:

networks:
  shn_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

services:
  db:
    image: postgres:14-alpine
    container_name: shn_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./deploy/docker/db/:/docker-entrypoint-initdb.d/
    env_file:
      - .env
    networks:
      - shn_network
    ports:
      - "5432:5442"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: shn_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  django_wsgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_wsgi
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - shn_network
    depends_on:
      - db
      - redis
    command: gunicorn -b 0.0.0.0 -p 8000 shajarehnaameh.wsgi:application
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "8080:8000"

  django_asgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_asgi
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - shn_network
    depends_on:
      - db
      - redis
    command: daphne -b 0.0.0.0 -p 8000 shajarehnaameh.asgi:application
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "8000:8000"

  nginx:
    container_name: shn_nginx
    image: nginx:1.27.5-alpine-slim
    depends_on:
      - django_asgi
      - django_wsgi
    volumes:
      - ./deploy/docker/nginx:/etc/nginx/conf.d
      - .src/static:/static
    networks:
      - shn_network
    ports:
      - "9000:80"