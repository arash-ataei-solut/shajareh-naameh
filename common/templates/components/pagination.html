{% load i18n %}
<nav aria-label="Page navigation example">
    <ul class="pagination justify-content-center mt-3">
        <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
            <a class="page-link"
               {% if page_obj.has_previous %}href="{{ page_url }}?page={{ page_obj.previous_page_number }}"{% endif %}>
                {% trans 'صفحه قبل' %}
            </a>
        </li>
        <li class="page-item active" aria-current="page">
            <span class="page-link">
                 {% trans 'صفحه' %} {{ page_obj.number }} {% trans 'از' %} {{ page_obj.paginator.num_pages }}
            </span>
        </li>
        <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
            <a class="page-link"{% if page_obj.has_next %} href="{{ page_url }}?page={{ page_obj.next_page_number }}"{% endif %}>
                {% trans 'صفحه بعد' %}
            </a>
        </li>
    </ul>
</nav>
